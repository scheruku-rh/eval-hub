type: object
description: |
  S3 (or S3-compatible) test data. Used when the evaluation **Kubernetes** runtime
  is enabled.

  The test-data **init container** loads the Secret named **`secret_ref`** from the
  job namespace. Secret data keys must include at least:

  - **`AWS_ACCESS_KEY_ID`** — access key
  - **`AWS_SECRET_ACCESS_KEY`** — secret key
  - **`AWS_DEFAULT_REGION`** — region (may be empty for some on-prem endpoints; see runtime notes)
  - **`AWS_S3_ENDPOINT`** — optional for AWS; **required** for many S3-compatible endpoints

  These align with Secrets commonly produced by ODH/RHOAI when an S3 connection is created.
required:
  - bucket
  - key
  - secret_ref
properties:
  bucket:
    type: string
    description: S3 bucket name.
  key:
    type: string
    description: |
      Object key or prefix within the bucket. Leading and trailing slashes are
      normalized. The init container lists objects under this prefix and downloads
      each into **`/test_data`**, keeping subdirectory structure relative to the prefix.
  secret_ref:
    type: string
    description: |
      Name of a Kubernetes **`Secret`** in the evaluation job namespace. Mounted
      read-only into the init container (implementation path such as
      `/var/run/secrets/test-data`). Must contain the AWS-style keys listed above.
example:
  bucket: my-eval-bucket
  key: datasets/benchmark-a/v1
  secret_ref: my-s3-connection-secret
